<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boas Práticas de Comunicação em Meios Eletrônicos</title>
  <style>
    :root { --barra-google: 14pt; }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8fafc;
    }

    .moldura {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    .moldura iframe {
      position: absolute;
      top: calc(-1 * var(--barra-google));
      left: 0;
      width: 100%;
      height: calc(100% + var(--barra-google));
      border: 0;
      display: block;
    }
  </style>
</head>
<body>

  <div class="moldura">
    <iframe
      src="https://script.google.com/macros/s/AKfycbz-Z1xzXLEMJ88DQtF-TfB907sdMIpQ80aD7RylHwPTu1mlselG3MreTzNVC25mjQaTMg/exec"
      title="Boas Práticas de Comunicação em Meios Eletrônicos"
      allow="fullscreen"
      allowfullscreen>
    </iframe>
  </div>

</body>
</html>
